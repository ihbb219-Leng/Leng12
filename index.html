    <!-- ===================================================================
         ตัวจับ Error แบบเห็นบนหน้าจอโดยตรง (ไม่ต้องเปิด Console เอง)
         วางไว้บนสุดตั้งใจ เพื่อให้ดักจับ error ได้ทุกจุด แม้สคริปต์หลักด้านล่าง
         จะพังตั้งแต่ parse time (เช่น ประกาศตัวแปรซ้ำ) ก็ยังเห็นข้อความนี้เด้งขึ้นมา
         กันตัวเองไม่ให้ถูกติดตั้งซ้ำ เผื่อสภาพแวดล้อมพรีวิวบางที่รันสคริปต์ซ้ำ
         =================================================================== -->
    <script>
        if (!window.__errorHookInstalled) {
            window.__errorHookInstalled = true;

            var __errBoxEl = null;
            function __ensureErrBox(){
                if (__errBoxEl) return __errBoxEl;
                __errBoxEl = document.createElement('div');
                __errBoxEl.id = 'js-error-box';
                __errBoxEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;' +
                    'background:#450a0a;color:#fecaca;font:12px/1.5 monospace;padding:10px;z-index:99999;' +
                    'border-top:3px solid #ef4444;white-space:pre-wrap;word-break:break-word;display:none;';
                var closeBtn = document.createElement('button');
                closeBtn.textContent = 'ปิดข้อความ error';
                closeBtn.style.cssText = 'display:block;margin-bottom:8px;background:#ef4444;color:#fff;border:none;' +
                    'padding:6px 10px;border-radius:6px;font-size:12px;';
                closeBtn.onclick = function(){ __errBoxEl.style.display = 'none'; };
                __errBoxEl.appendChild(closeBtn);
                (document.body || document.documentElement).appendChild(__errBoxEl);
                return __errBoxEl;
            }
            function __showErr(label, detail){
                var attach = function(){
                    var box = __ensureErrBox();
                    box.style.display = 'block';
                    var line = document.createElement('div');
                    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + label + ': ' + detail;
                    line.style.marginBottom = '6px';
                    box.appendChild(line);
                };
                if (document.body) attach();
                else document.addEventListener('DOMContentLoaded', attach);
            }
            window.addEventListener('error', function(e){
                var loc = (e.filename || 'inline') + ':' + e.lineno + ':' + e.colno;
                __showErr('JS Error', (e.message || 'unknown error') + '  (' + loc + ')');
            });
            window.addEventListener('unhandledrejection', function(e){
                var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
                __showErr('Unhandled Promise Rejection', reason);
            });
        }
    </script>

    <script>
    (function(){ // ← เปิด IIFE: ตัวแปรทั้งหมดในสคริปต์นี้จะถูกจำกัดขอบเขตไว้ในนี้
                 // ป้องกัน "Identifier already declared" แม้สคริปต์นี้จะถูกรันซ้ำ
                 // โดยเครื่องมือพรีวิวบางตัว (ต่างจาก const/let นอก IIFE ซึ่งชนกันได้)
        // 🔑 ตั้งค่า Supabase เชื่อมต่อโปรเจกต์ของคุณ
        const SUPABASE_URL = 'https://fobadwvnbwhjuollravi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvYmFkd3ZuYndoanVvbGxyYXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NjczODQsImV4cCI6MjEwMTE0MzM4NH0.ZBgXbRnGkdYzINSHYmusSKnWqKllzGsaG9c09VCL8OY';

        // ⚠️ กันหน้าเว็บ "ตายทั้งหน้า" ถ้าโหลดไลบรารี Supabase จาก CDN ไม่สำเร็จ (เน็ตช้า/หลุด/ถูกบล็อก)
        // ถ้าปล่อยให้บรรทัดสร้าง client พังตรงๆ โค้ดทั้งหมดที่อยู่หลังจากนี้ในสคริปต์นี้จะไม่ทำงานเลยสักบรรทัด
        // รวมถึงปุ่ม "เข้าสู่ระบบ" ที่ไม่ต้องพึ่ง Supabase ก็จะกดไม่ได้ไปด้วย — จึงต้องดักไว้ตรงนี้
        let supabaseClient = null;
        try{
            if(window.supabase && typeof window.supabase.createClient === 'function'){
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                console.error('ไม่พบไลบรารี Supabase (window.supabase) — สคริปต์จาก CDN อาจโหลดไม่สำเร็จ');
            }
        }catch(err){
            console.error('สร้าง Supabase client ไม่สำเร็จ:', err);
        }
        const supabase = supabaseClient; // ตัวแปรเดิมที่ใช้เรียกทั่วทั้งไฟล์ (อาจเป็น null ถ้าโหลดไม่สำเร็จ)

        // เรียกก่อนใช้ supabase.* ทุกครั้งในฟังก์ชันที่ทำงานกับฐานข้อมูล กันไม่ให้พังแบบเงียบๆ
        function ensureSupabaseReady(){
            if(!supabase){
                alert('เชื่อมต่อระบบไม่สำเร็จ (โหลดไลบรารีไม่ได้) กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้าเว็บ');
                return false;
            }
            return true;
        }

        // หมายเหตุ: anon key ตัวนี้ "ตั้งใจ" ให้เปิดเผยในโค้ดฝั่ง client ได้ (เป็นค่ามาตรฐานของ Supabase)
        // ความปลอดภัยทั้งหมดต้องมาจาก Row Level Security + ฟังก์ชัน RPC ในฐานข้อมูล ไม่ใช่การซ่อนคีย์นี้
        // ห้ามนำ service_role key มาใส่ในไฟล์ฝั่ง client เด็ดขาด เพราะมันจะข้าม RLS ได้ทั้งหมด

        let currentUser = null;   // จะถูกเซ็ตจาก supabase.auth เท่านั้น ไม่ใช้ localStorage เก็บอีเมลแบบเดิมอีกต่อไป
        let userCoins = 0;
        let dailyClaimedToday = false;
        let authMode = 'login';  // 'login' | 'signup'

        /* ---------------------------------------------------------------
           AUTH: ล็อกอิน/สมัครสมาชิกด้วยอีเมล + รหัสผ่านจริงผ่าน Supabase Auth
           (แทนที่ prompt() แบบเดิมที่ไม่มีรหัสผ่าน ใครก็พิมพ์อีเมลคนอื่นเข้าได้)
           --------------------------------------------------------------- */
        function openAuthModal(){
            authMode = 'login';
            updateAuthModalUI();
            document.getElementById('auth-modal').style.display = 'flex';
        }
        function closeAuthModal(){
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-password').value = '';
        }
        function toggleAuthMode(){
            authMode = authMode === 'login' ? 'signup' : 'login';
            updateAuthModalUI();
        }
        function updateAuthModalUI(){
            const isLogin = authMode === 'login';
            document.getElementById('auth-modal-title').textContent = isLogin ? 'เข้าสู่ระบบ' : 'สมัครสมาชิกใหม่';
            document.getElementById('auth-submit-btn').textContent = isLogin ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
            document.getElementById('auth-switch-text').innerHTML = isLogin
                ? 'ยังไม่มีบัญชี? <a onclick="toggleAuthMode()">สมัครสมาชิก</a>'
                : 'มีบัญชีอยู่แล้ว? <a onclick="toggleAuthMode()">เข้าสู่ระบบ</a>';
        }

        async function handleAuthSubmit(){
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            if(!email || !email.includes('@')){ alert('กรอกอีเมลให้ถูกต้อง'); return; }
            if(!password || password.length < 6){ alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }

            if(!ensureSupabaseReady()) return;

            const btn = document.getElementById('auth-submit-btn');
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'กำลังดำเนินการ...';

            try{
                if(authMode === 'login'){
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if(error) throw error;
                    closeAuthModal(); // onAuthStateChange จะอัปเดต UI/โหลดข้อมูลให้เองหลังล็อกอินสำเร็จ
                } else {
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if(error) throw error;
                    if(data.session){
                        closeAuthModal();
                    } else {
                        alert('สมัครสำเร็จ! กรุณาตรวจสอบอีเมลของคุณเพื่อยืนยันบัญชีก่อนเข้าสู่ระบบ');
                        authMode = 'login';
                        updateAuthModalUI();
                    }
                }
            }catch(err){
                console.error(err);
                alert('เกิดข้อผิดพลาด: ' + (err.message || 'ไม่ทราบสาเหตุ กรุณาลองใหม่'));
            }finally{
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        async function logout(){
            if(!confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) return;
            if(!ensureSupabaseReady()) return;
            await supabase.auth.signOut();
            // onAuthStateChange จะเคลียร์ currentUser / คะแนน / ประวัติให้อัตโนมัติ
        }

        function checkLoginState(){
            const authArea = document.getElementById('auth-area');
            if (currentUser) {
                const shortName = (currentUser.email || '').split('@')[0];
                authArea.innerHTML = `
                    <span style="font-weight:bold; color:#818cf8; font-size:14px;">👤 ${shortName}</span>
                    <button class="profile-btn logout-btn" onclick="logout()">ออกจากระบบ</button>
                `;
            } else {
                authArea.innerHTML = `<button class="profile-btn" id="login-btn" onclick="openAuthModal()">เข้าสู่ระบบ</button>`;
            }
        }

        // ทุกครั้งที่สถานะล็อกอินเปลี่ยน (ล็อกอินสำเร็จ, ออกจากระบบ, โหลดหน้าเว็บครั้งแรกที่มี session ค้างอยู่)
        // Supabase จะยิง event นี้มาให้เสมอ ใช้จุดนี้จุดเดียวเป็นศูนย์กลางอัปเดตทั้งหน้า
        if(supabase){
            supabase.auth.onAuthStateChange(async (_event, session) => {
                currentUser = session?.user || null;
                checkLoginState();
                if (currentUser) {
                    await loadProfile();
                    await loadHistory();
                    await loadShortlinkCompletionStatus(); // ปิดปุ่ม Shortlink ที่ทำไปแล้ววันนี้ให้ตรงความจริง
                    await processPendingShortlinkReturn();  // เช็คสัญญาณจากเว็บลูกที่อาจ redirect กลับมา
                } else {
                    userCoins = 0;
                    dailyClaimedToday = false;
                    updateCoinsUI();
                    renderHistory([]);
                }
            });
        } else {
            checkLoginState(); // ยังต้องวาดปุ่ม "เข้าสู่ระบบ" ให้กดได้ แม้เชื่อมต่อ Supabase ไม่สำเร็จ
        }

        updateWithdrawUI(); // สร้างฟอร์มถอนเงินเริ่มต้น (ค่าเริ่มต้นคือช่องทาง LA QR)

        /* ---------------------------------------------------------------
           PROFILE / COINS — อ่านค่าจริงจากตาราง profiles เท่านั้น
           ห้ามคำนวณแต้มเองแล้วเขียนทับตรงๆ จากฝั่ง client อีกต่อไป
           --------------------------------------------------------------- */
        function updateCoinsUI(){
            document.getElementById('user-coins').innerText = userCoins.toLocaleString('th-TH');
        }

        function todayStr(){
            return new Date().toISOString().slice(0, 10); // ใช้ format เดียวกับ current_date ฝั่ง Postgres (UTC)
        }

        async function loadProfile(){
            if(!currentUser) return;
            try{
                const { data, error } = await supabase
                    .from('profiles')
                    .select('coins, last_daily_claim')
                    .eq('id', currentUser.id)
                    .single();

                if(error){ console.error(error); return; }
                if(data){
                    userCoins = data.coins;
                    dailyClaimedToday = data.last_daily_claim === todayStr();
                    updateCoinsUI();
                    const dailyBtn = document.getElementById('daily-btn');
                    dailyBtn.disabled = dailyClaimedToday;
                    dailyBtn.textContent = dailyClaimedToday ? 'รับแล้ววันนี้' : 'กดรับแต้มรายวัน (+1)';
                }
            }catch(err){
                console.error(err);
            }
        }

        /* ---------------------------------------------------------------
           ประวัติการทำรายการ — ดึงจาก DB จริง (withdrawals + task_completions)
           แทนที่ localStorage เดิมซึ่งหายไปทันทีที่เปลี่ยนเครื่อง/ล้าง cache
           --------------------------------------------------------------- */
        async function loadHistory(){
            if(!currentUser){ renderHistory([]); return; }
            try{
                const [wd, tc] = await Promise.all([
                    supabase.from('withdrawals').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false }).limit(15),
                    supabase.from('task_completions').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false }).limit(15),
                ]);

                const items = [];
                if(wd.data){
                    wd.data.forEach(w => {
                        const statusLabel = w.status === 'confirmed' ? 'โอนสำเร็จ ✅' : (w.status === 'rejected' ? 'ถูกปฏิเสธ ❌' : 'รอดำเนินการ ⏳');
                        const methodLabel = w.method === 'laqr' ? 'LA QR' : 'USDT (BEP20)';
                        let text = `แจ้งถอนเงิน ${methodLabel} จำนวน ${w.amount_coins.toLocaleString('th-TH')} คะแนน — ${statusLabel}`;
                        if(w.status === 'confirmed' && w.slip_image_url){
                            text += ` <a href="${w.slip_image_url}" target="_blank" rel="noopener" style="color:#818cf8;">[ดูสลิปโอนเงิน]</a>`;
                        }
                        items.push({ time: w.created_at, text });
                    });
                }
                if(tc.data){
                    tc.data.forEach(t => {
                        const label = t.task_type === 'shortlink' ? `ภารกิจ Shortlink #${t.task_index}` : `ภารกิจข่าวที่ ${t.task_index}`;
                        items.push({ time: t.created_at, text: `${label} สำเร็จ` });
                    });
                }
                items.sort((a, b) => new Date(b.time) - new Date(a.time));
                renderHistory(items.slice(0, 20));
            }catch(err){
                console.error(err);
            }
        }

        function renderHistory(items){
            const container = document.getElementById('history-container');
            if(!items || items.length === 0){
                container.innerHTML = `<div class="history-item" style="color:#64748b; text-align:center;">ยังไม่มีประวัติการทำรายการ</div>`;
                return;
            }
            container.innerHTML = items.map(it =>
                `<div class="history-item">[${new Date(it.time).toLocaleString('th-TH')}] ${it.text}</div>`
            ).join('');
        }

        /* ---------------------------------------------------------------
           DAILY REWARD — เช็ควันที่ล่าสุดที่ฝั่งเซิร์ฟเวอร์ (RPC) ป้องกันรีเฟรชแล้วรับซ้ำ
           --------------------------------------------------------------- */
        async function claimDaily(){
            if(!currentUser){ alert('กรุณาเข้าสู่ระบบก่อนกดรับแต้มรายวัน!'); return; }
            const btn = document.getElementById('daily-btn');
            if(btn.disabled) return;

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'กำลังรับ...';

            try{
                const { data, error } = await supabase.rpc('claim_daily_reward');
                if(error) throw error;

                if(data.ok){
                    userCoins += data.awarded;
                    updateCoinsUI();
                    dailyClaimedToday = true;
                    btn.textContent = 'รับแล้ววันนี้';
                    alert('รับแต้มรายวัน +' + data.awarded + ' คะแนนสำเร็จ!');
                    loadHistory();
                } else if(data.message === 'already_claimed'){
                    dailyClaimedToday = true;
                    btn.textContent = 'รับแล้ววันนี้';
                    alert('วันนี้รับไปแล้ว พรุ่งนี้ค่อยมาใหม่นะ');
                } else {
                    btn.disabled = false;
                    btn.textContent = originalText;
                    alert('ทำรายการไม่สำเร็จ ลองใหม่อีกครั้ง');
                }
            }catch(err){
                console.error(err);
                btn.disabled = false;
                btn.textContent = originalText;
                alert('เชื่อมต่อไม่สำเร็จ: ' + (err.message || 'กรุณาลองใหม่'));
            }
        }

        /* ---------------------------------------------------------------
           SHORTLINK TASKS — ไปเว็บลูกในแท็บเดิม แล้วเว็บลูก redirect กลับมาเองพร้อม
           ?shortlink_done=N เมื่อทำภารกิจเสร็จ การให้แต้มจริงเกิดขึ้นที่ฟังก์ชัน RPC
           เท่านั้น (ป้องกันการปลอมสัญญาณ เพราะ complete_task เช็ค unique constraint ต่อวัน)
           --------------------------------------------------------------- */
        function markShortlinkDone(taskIndex, taskType){
            const prefix = taskType === 'shortlink_i' ? 'shortlink-i-btn-' : 'shortlink-btn-';
            const btn = document.getElementById(prefix + taskIndex);
            if(!btn) return;
            btn.disabled = true;
            const label = taskType === 'shortlink_i' ? 'Shortlink I ' + taskIndex : 'Shortlink ' + taskIndex;
            btn.textContent = '✓ ' + label + ' (ทำแล้ววันนี้)';
        }

        function openShortlink(url, taskId, taskType){
            taskType = taskType || 'shortlink'; // ปุ่ม Shortlink เดิม 10 ปุ่มไม่ได้ส่งค่านี้มา ให้ถือเป็น 'shortlink' ตามเดิม
            if(!currentUser){ alert('กรุณาเข้าสู่ระบบก่อนทำภารกิจ!'); return; }
            if(url.includes('ใส่ลิงก์')){
                alert('แจ้งเตือน: คุณยังไม่ได้นำลิงก์เว็บลูกมาใส่ที่ปุ่มนี้!');
                return;
            }
            try{
                // แปะเลขภารกิจ (?task=N) ต่อท้ายลิงก์ให้อัตโนมัติ เว็บลูกจะได้รู้ว่ากำลังทำภารกิจข้อไหน
                // (ไม่ต้องแปะ type ไปด้วย เพราะเว็บลูกแต่ละแบบรู้ประเภทของตัวเองอยู่แล้ว
                //  จะใส่ type=shortlink_i กลับมาเองตอน redirect กลับมาที่นี่)
                const separator = url.includes('?') ? '&' : '?';
                const fullUrl = url + separator + 'task=' + taskId;
                // ไปเว็บลูกในแท็บเดิม (ไม่เปิดแท็บใหม่) เพราะเว็บลูกจะ redirect กลับมาที่นี่เองเมื่อทำเสร็จ
                window.location.href = fullUrl;
            }catch(err){
                console.error(err);
                alert('เปิดลิงก์ไม่สำเร็จ');
            }
        }

        // อ่านสัญญาณ "ทำภารกิจสำเร็จ" ที่เว็บลูก Shortlink ส่งกลับมาผ่าน query string
        // (เว็บลูก redirect กลับมาที่นี่พร้อม ?shortlink_done=N&type=shortlink_i หลังทำภารกิจครบ)
        let pendingShortlinkTaskId = null;
        let pendingShortlinkTaskType = 'shortlink';
        (function captureShortlinkReturn(){
            const p = new URLSearchParams(window.location.search);
            const doneId = p.get('shortlink_done');
            if(doneId !== null){
                const idx = Number(doneId);
                if(Number.isInteger(idx) && idx >= 1 && idx <= 30){
                    pendingShortlinkTaskId = idx;
                }
                const t = p.get('type');
                pendingShortlinkTaskType = (t === 'shortlink_i') ? 'shortlink_i' : 'shortlink';
                // ล้าง query string ออกจาก URL ทันที กันค้างเวลารีเฟรชหรือแชร์ลิงก์ต่อ
                window.history.replaceState({}, '', window.location.pathname + window.location.hash);
            }
        })();

        async function processPendingShortlinkReturn(){
            if(pendingShortlinkTaskId === null) return;
            const taskIndex = pendingShortlinkTaskId;
            const taskType = pendingShortlinkTaskType;
            pendingShortlinkTaskId = null; // กันประมวลผลซ้ำ

            try{
                const { data, error } = await supabase.rpc('complete_task', {
                    p_task_type: taskType,
                    p_task_index: taskIndex,
                });
                if(error) throw error;

                if(data.ok){
                    userCoins += data.awarded;
                    updateCoinsUI();
                    markShortlinkDone(taskIndex, taskType);
                    alert('🎉 ทำภารกิจสำเร็จ! ได้รับแต้มเพิ่ม +' + data.awarded + ' คะแนน');
                    loadHistory();
                } else if(data.message === 'already_completed_today'){
                    markShortlinkDone(taskIndex, taskType); // ทำไปแล้วจริงๆ วันนี้ ให้ปุ่มขึ้นสถานะปิดไว้เหมือนกัน
                } else {
                    console.warn('complete_task ไม่สำเร็จ:', data.message);
                }
            }catch(err){
                console.error(err);
            }
        }

        // เผื่อไว้กรณีเว็บลูกเปิดแบบ popup แล้วยังส่ง postMessage กลับมาแทนการ redirect
        window.addEventListener('message', async function(event){
            if(!(event.data && event.data.type === 'SHORTLINK_COMPLETE')) return;
            if(!currentUser) return;

            const taskIndex = Number(event.data.taskId);
            if(!Number.isInteger(taskIndex) || taskIndex < 1 || taskIndex > 30) return;
            const taskType = (event.data.taskType === 'shortlink_i') ? 'shortlink_i' : 'shortlink';

            try{
                const { data, error } = await supabase.rpc('complete_task', {
                    p_task_type: taskType,
                    p_task_index: taskIndex,
                });
                if(error) throw error;

                if(data.ok){
                    userCoins += data.awarded;
                    updateCoinsUI();
                    markShortlinkDone(taskIndex, taskType);
                    alert('🎉 ทำภารกิจสำเร็จ! ได้รับแต้มเพิ่ม +' + data.awarded + ' คะแนน');
                    loadHistory();
                } else if(data.message === 'already_completed_today'){
                    markShortlinkDone(taskIndex, taskType);
                } else {
                    console.warn('complete_task ไม่สำเร็จ:', data.message);
                }
            }catch(err){
                console.error(err);
            }
        }, false);

        // โหลดสถานะภารกิจ Shortlink / Shortlink I ที่ทำไปแล้ว "วันนี้" มาปิดปุ่มให้ตรงกับความจริง
        // (สำคัญตอนรีเฟรชหน้าเว็บ ไม่งั้นปุ่มที่ทำไปแล้วจะกลับมากดได้เหมือนยังไม่ทำ)
        async function loadShortlinkCompletionStatus(){
            if(!currentUser) return;
            try{
                const { data, error } = await supabase
                    .from('task_completions')
                    .select('task_index, task_type')
                    .eq('user_id', currentUser.id)
                    .in('task_type', ['shortlink', 'shortlink_i'])
                    .eq('completed_on', todayStr());
                if(error){ console.error(error); return; }
                (data || []).forEach(row => markShortlinkDone(row.task_index, row.task_type));
            }catch(err){
                console.error(err);
            }
        }

        /* ---------------------------------------------------------------
           WITHDRAWAL — หักแต้ม + บันทึกคำขอแบบอะตอมมิกฝั่งเซิร์ฟเวอร์ (RPC)
           การยืนยันว่าโอนเงินแล้ว (อัปโหลดสลิป/เปลี่ยนสถานะ) ทำโดยแอดมินเท่านั้น
           ผ่าน Supabase Table Editor — client ไม่มีสิทธิ์แก้ status ของตัวเอง
           --------------------------------------------------------------- */
        function updateWithdrawUI(){
            const method = document.getElementById('withdraw-method').value;
            const fields = document.getElementById('withdraw-fields');
            if(method === 'laqr'){
                fields.innerHTML = `
                    <label>อัปโหลดรูป QR code รับเงินของคุณ (LA QR):</label>
                    <input type="file" id="withdraw-qr-file" accept="image/*" style="padding:8px;">
                    <img id="withdraw-qr-preview" style="display:none; max-width:100%; max-height:200px; margin-top:8px; border-radius:8px;">
                `;
                const fileInput = document.getElementById('withdraw-qr-file');
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    const preview = document.getElementById('withdraw-qr-preview');
                    if(!file){ preview.style.display = 'none'; return; }
                    if(file.size > 5 * 1024 * 1024){
                        alert('ไฟล์รูปใหญ่เกิน 5MB กรุณาเลือกไฟล์ใหม่');
                        e.target.value = '';
                        preview.style.display = 'none';
                        return;
                    }
                    preview.src = URL.createObjectURL(file);
                    preview.style.display = 'block';
                });
            } else {
                fields.innerHTML = `<label>Wallet Address (BSC - BEP20):</label><input type="text" id="withdraw-target" placeholder="0x...">`;
            }
        }

        async function requestWithdraw(){
            if(!currentUser){ alert('กรุณาเข้าสู่ระบบก่อนถอนเงิน!'); return; }

            const method = document.getElementById('withdraw-method').value;
            const btn = document.querySelector('.withdraw-btn');

            let target = '';       // ใช้กับ USDT: wallet address
            let qrImageUrl = null; // ใช้กับ LA QR: URL รูปหลังอัปโหลดขึ้น Storage

            if(method === 'laqr'){
                const fileInput = document.getElementById('withdraw-qr-file');
                const file = fileInput && fileInput.files[0];
                if(!file){ alert('กรุณาอัปโหลดรูป QR code รับเงินของคุณก่อน'); return; }

                btn.disabled = true;
                const originalText = btn.textContent;
                btn.textContent = 'กำลังอัปโหลดรูป...';

                try{
                    const path = `${currentUser.id}/${Date.now()}-${file.name}`;
                    const { error: uploadError } = await supabase.storage
                        .from('withdrawal-qr')
                        .upload(path, file);
                    if(uploadError) throw uploadError;

                    const { data: pub } = supabase.storage.from('withdrawal-qr').getPublicUrl(path);
                    qrImageUrl = pub.publicUrl;
                }catch(err){
                    console.error(err);
                    alert('อัปโหลดรูปไม่สำเร็จ: ' + (err.message || 'กรุณาลองใหม่'));
                    btn.disabled = false;
                    btn.textContent = originalText;
                    return;
                }
            } else {
                const targetInput = document.getElementById('withdraw-target');
                target = targetInput ? targetInput.value.trim() : '';
                if(!target){ alert('กรุณากรอก Wallet Address ให้ครบถ้วน!'); return; }
            }

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'กำลังส่งคำขอ...';

            try{
                const { data, error } = await supabase.rpc('request_withdrawal', {
                    p_method: method,
                    p_amount: 1000,
                    p_target: target || null,
                    p_qr_image_url: qrImageUrl,
                });
                if(error) throw error;

                if(data.ok){
                    await loadProfile();
                    await loadHistory();
                    alert(method === 'laqr'
                        ? 'ส่งคำขอถอนเงินผ่าน LA QR สำเร็จ! รอแอดมินโอนเงินและแนบสลิปยืนยัน'
                        : 'ส่งคำขอถอนเงิน USDT สำเร็จ!');
                    updateWithdrawUI(); // เคลียร์ฟอร์ม/รูปพรีวิวกลับเป็นค่าว่าง
                } else if(data.message === 'insufficient_coins'){
                    alert('แต้มของคุณยังไม่ถึงขั้นต่ำในการถอน (ขั้นต่ำ 1,000 คะแนน)');
                } else {
                    alert('ทำรายการไม่สำเร็จ: ' + data.message);
                }
            }catch(err){
                console.error(err);
                alert('เชื่อมต่อไม่สำเร็จ: ' + (err.message || 'กรุณาลองใหม่'));
            }finally{
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        // เปิดให้ HTML เรียกใช้ได้ (attribute onclick/onchange มองหาแค่ใน window เท่านั้น
        // ฟังก์ชันที่ประกาศข้างในนี้โดยไม่ export แบบนี้จะถูกซ่อนอยู่แค่ใน IIFE มองไม่เห็นจากภายนอก)
        window.openAuthModal = openAuthModal;
        window.closeAuthModal = closeAuthModal;
        window.toggleAuthMode = toggleAuthMode;
        window.handleAuthSubmit = handleAuthSubmit;
        window.logout = logout;
        window.claimDaily = claimDaily;
        window.openShortlink = openShortlink;
        window.updateWithdrawUI = updateWithdrawUI;
        window.requestWithdraw = requestWithdraw;

    })(); // ← ปิด IIFE
    </script>
</body>
</html>
